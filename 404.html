<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>pchat</title>
    <!--
      GitHub Pages SPA tekniği (spa-github-pages):
      Bilinmeyen yolu (/pchat/<id>) query string'e çevirip index.html'e yönlendirir.
      pathSegmentsToKeep = 1 → "/pchat" base path'i korunur.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
